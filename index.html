<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--s1:#121721;--s2:#171d2a;--s3:#1e2636;--border:#252d3d;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--warn:#f59e0b;--gold:#eab308;--purple:#a78bfa;--teal:#2dd4bf;--cyan:#22d3ee;--pink:#f472b6;--text:#e2e8f0;--muted:#64748b;--dim:#475569;--font-mono:'JetBrains Mono',monospace;--font-sans:'DM Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;min-height:100vh;overflow-x:hidden;}
::selection{background:var(--accent);color:#fff;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.setup-screen{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg);}
.setup-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:440px;text-align:center;}
.setup-card h1{font-size:20px;font-weight:800;font-family:var(--font-mono);margin-bottom:6px;}
.setup-card p{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.7;}
.setup-card a{color:var(--accent);}
.setup-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:13px;font-family:var(--font-mono);margin-bottom:10px;}
.setup-input:focus{outline:none;border-color:var(--accent);}
.setup-btn{width:100%;padding:11px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.setup-btn:hover{background:#2563eb;}.setup-btn:disabled{opacity:.5;cursor:not-allowed;}
.setup-btn-sec{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;}
.setup-btn-sec:hover{border-color:var(--accent);color:var(--accent);}
.setup-status{margin-top:10px;font-size:12px;min-height:16px;font-family:var(--font-mono);}
.setup-status.ok{color:var(--green);}.setup-status.err{color:var(--red);}
#app{display:none;}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--s1);border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-weight:800;font-size:18px;letter-spacing:-1px;color:var(--text);flex-shrink:0;cursor:pointer;}
.logo-icon{color:var(--warn);font-size:20px;}
.ticker-scroll{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);}
.ticker-track{display:flex;gap:24px;align-items:center;white-space:nowrap;font-family:var(--font-mono);font-size:12px;font-weight:500;animation:tscroll 35s linear infinite;width:max-content;}
.ticker-track:hover{animation-play-state:paused;}
@keyframes tscroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:6px;}.ticker-sym{color:var(--muted);font-weight:700;}.ticker-price{color:var(--text);font-weight:700;}.ticker-chg{font-weight:700;font-size:11px;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.mkt-badge{padding:4px 12px;border-radius:4px;font-size:11px;font-weight:800;font-family:var(--font-mono);letter-spacing:.5px;}
.mkt-o{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.mkt-c{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.mkt-p{background:rgba(245,158,11,.1);color:var(--warn);border:1px solid rgba(245,158,11,.25);}
.clock{color:var(--muted);font-family:var(--font-mono);font-size:12px;font-weight:500;}
.live-dot{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--green);font-family:var(--font-mono);}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.settings-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:5px 8px;cursor:pointer;font-size:12px;}
.settings-btn:hover{border-color:var(--accent);color:var(--accent);}
.progress-bar{height:2px;background:var(--border);}.progress-fill{height:100%;background:var(--accent);transition:width 1s linear;}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;display:none;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.nav{display:flex;gap:4px;padding:8px 20px;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;}
.nav-tab{padding:7px 16px;border-radius:5px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;border:none;background:transparent;white-space:nowrap;letter-spacing:.5px;}
.nav-tab:hover{color:var(--text);background:var(--s2);}.nav-tab.active{background:var(--accent);color:#fff;}
.page{display:none;padding:20px;max-width:1600px;margin:0 auto;}.page.active{display:block;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px;}
.card-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.card{background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:16px;}.card:hover{border-color:rgba(255,255,255,.08);}
.card-label{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.card-value{font-family:var(--font-mono);font-size:28px;font-weight:800;margin-bottom:4px;}.card-sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);}.card-sm{font-size:22px;}
.ad-bar{height:14px;border-radius:3px;overflow:hidden;display:flex;margin:6px 0;}.ad-bar-adv{background:var(--green);}.ad-bar-dec{background:var(--red);}
.sector-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);}.sector-row:last-child{border:none;}
.sector-name{font-size:12px;width:140px;flex-shrink:0;}.sector-bar-wrap{flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden;}
.sector-bar-fill{height:100%;border-radius:4px;}.sector-pct{font-family:var(--font-mono);font-size:12px;font-weight:700;width:50px;text-align:right;flex-shrink:0;}
.ma-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}.ma-label{font-family:var(--font-mono);font-size:12px;width:100px;flex-shrink:0;}
.ma-bar-wrap{flex:1;height:10px;background:var(--s3);border-radius:5px;overflow:hidden;}.ma-bar-fill{height:100%;border-radius:5px;}
.ma-pct{font-family:var(--font-mono);font-size:12px;font-weight:700;width:50px;text-align:right;flex-shrink:0;}
.interp-card{border-left:3px solid;padding:12px 16px;margin-bottom:10px;border-radius:0 6px 6px 0;background:var(--s2);}
.interp-title{font-family:var(--font-mono);font-size:12px;font-weight:700;margin-bottom:4px;}
.interp-body{font-size:12px;color:var(--muted);line-height:1.6;font-family:var(--font-mono);}
.edf{background:transparent;border:none;border-bottom:1px dashed var(--border);color:inherit;font:inherit;width:auto;min-width:30px;max-width:80px;text-align:center;padding:0 2px;}
.edf:focus{outline:none;border-bottom-color:var(--accent);}.edf-lg{font-size:28px;font-weight:800;font-family:var(--font-mono);max-width:140px;}.edf-sm{font-size:13px;max-width:60px;}
.section{margin-bottom:24px;}
.section-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--s1);border:1px solid var(--border);border-radius:8px 8px 0 0;flex-wrap:wrap;}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}.section-title{font-family:var(--font-mono);font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.section-desc{color:var(--dim);font-size:12px;font-family:var(--font-mono);}.section-count{background:var(--s3);color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.grp-dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle;}.grp-dot{width:6px;height:6px;border-radius:50%;display:inline-block;opacity:.85;}.sec-checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 0;}.sec-checks label{display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--font-mono);cursor:pointer;text-transform:none;letter-spacing:0;color:var(--text);}.sec-checks input{accent-color:var(--accent);width:14px;height:14px;margin:0;}
.section-spacer{flex:1;}.section-add{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.section-add input{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-family:var(--font-mono);font-size:12px;font-weight:700;width:80px;text-transform:uppercase;}
.section-add input:focus{outline:none;border-color:var(--accent);}
.section-add select{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;color:var(--text);font-size:11px;font-family:var(--font-mono);cursor:pointer;}
.add-btn{background:var(--accent);border:none;border-radius:4px;color:#fff;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}.add-btn:hover{background:#2563eb;}
.section-table{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;}
.section-table.empty-table{padding:30px;text-align:center;color:var(--dim);font-size:12px;background:var(--s1);font-family:var(--font-mono);}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 12px;text-align:left;font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;background:var(--s2);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;white-space:nowrap;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}tbody tr:hover td{background:rgba(255,255,255,.02);}
.cell-ticker{font-family:var(--font-mono);font-weight:800;font-size:13px;letter-spacing:.3px;}
.cell-price{font-family:var(--font-mono);font-weight:700;}.cell-pct{font-family:var(--font-mono);font-weight:700;font-size:12px;}
.cell-up{color:var(--green);}.cell-down{color:var(--red);}.cell-flat{color:var(--muted);}
.arrow-up::before{content:'▲ ';font-size:9px;}.arrow-down::before{content:'▼ ';font-size:9px;}
.stage-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:.5px;}
.stage-s1,.stage-s1a,.stage-s1b{background:rgba(245,158,11,.1);color:var(--warn);border:1px solid rgba(245,158,11,.2);}
.stage-s2,.stage-s2a,.stage-s2b{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}

.stage-s3,.stage-s3a,.stage-s3b{background:rgba(245,158,11,.1);color:var(--warn);border:1px solid rgba(245,158,11,.2);}
.stage-s4,.stage-s4a,.stage-s4b{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.cell-rs{font-family:var(--font-mono);font-weight:800;font-size:13px;}
.rs-delta{font-family:var(--font-mono);font-size:10px;font-weight:800;margin-left:4px;padding:1px 4px;border-radius:4px;vertical-align:1px;}
.rs-delta.up{color:var(--green);background:rgba(34,197,94,.12);}
.rs-delta.dn{color:var(--red);background:rgba(239,68,68,.12);}.st-delta{font-family:var(--font-mono);font-size:10px;font-weight:800;margin-left:6px;padding:1px 4px;border-radius:4px;vertical-align:1px;cursor:help;}.st-delta.up{color:var(--green);background:rgba(34,197,94,.12);}.st-delta.dn{color:var(--red);background:rgba(239,68,68,.12);}.st-delta.nt{color:var(--muted);background:rgba(148,163,184,.12);}
.cell-dt{display:inline-flex;flex-direction:column;line-height:1.25;font-family:var(--font-mono);font-size:12px;color:var(--text);white-space:nowrap;cursor:help;}
.cell-dt .dt-age{font-size:10px;color:var(--muted);}.cell-dt .dt-age.fresh{color:var(--green);}.cell-dt .dt-age.stale{color:var(--warn);}
.cell-dt-na{color:var(--dim);font-family:var(--font-mono);font-size:12px;cursor:help;}
.cell-notes{color:var(--muted);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell-ants{font-family:var(--font-mono);font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:help;}
.ants-score{padding:2px 6px;border-radius:3px;letter-spacing:.3px;}
.ants-s-hi{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.ants-s-md{background:rgba(234,179,8,.12);color:var(--gold);border:1px solid rgba(234,179,8,.22);}
.ants-s-lo{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid rgba(100,116,139,.2);}
.ants-flag{font-size:13px;filter:drop-shadow(0 0 3px rgba(34,197,94,.4));}
.cell-ants-pending{color:var(--dim);font-family:var(--font-mono);font-size:11px;}
.cell-ants-na{color:var(--dim);font-family:var(--font-mono);font-size:12px;}
.cell-wanda{font-family:var(--font-mono);font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:help;}
.wanda-score{padding:2px 6px;border-radius:3px;letter-spacing:.3px;}
.wanda-s-hi{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.wanda-s-md{background:rgba(234,179,8,.12);color:var(--gold);border:1px solid rgba(234,179,8,.22);}
.wanda-s-lo{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid rgba(100,116,139,.2);}
.cell-wanda-pending{color:var(--dim);font-family:var(--font-mono);font-size:11px;}
.cell-wanda-na{color:var(--dim);font-family:var(--font-mono);font-size:12px;}
.cell-h52{display:inline-flex;flex-direction:column;line-height:1.25;font-family:var(--font-mono);cursor:help;}
.h52-px{font-weight:700;font-size:12px;color:var(--text);}
.h52-off{font-weight:700;font-size:10px;letter-spacing:.3px;}
.h52-at{color:var(--green);}.h52-near{color:var(--green);opacity:.85;}.h52-mid{color:var(--gold);}.h52-far{color:var(--muted);}.h52-deep{color:var(--red);}
.h52-new{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:.6px;background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);align-self:flex-start;}
.cell-h52-na{color:var(--dim);font-family:var(--font-mono);font-size:12px;}
.row-actions{display:flex;gap:4px;}.row-btn{background:none;border:1px solid var(--border);border-radius:3px;color:var(--dim);padding:3px 8px;cursor:pointer;font-size:11px;font-family:var(--font-mono);}
.row-btn:hover{border-color:var(--accent);color:var(--accent);}.row-btn-del:hover{border-color:var(--red);color:var(--red);}
.search-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.search-wrap{position:relative;flex:1;max-width:400px;}.search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;}
.search-wrap input{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:8px 14px 8px 32px;color:var(--text);font-size:13px;}.search-wrap input:focus{outline:none;border-color:var(--accent);}
.refresh-btn{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;}.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.mo.open{display:flex;}.md{background:var(--s1);border:1px solid var(--border);border-radius:10px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.mh h2{font-size:14px;font-weight:800;font-family:var(--font-mono);}
.mcb{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}.mcb:hover{color:var(--text);}
.mb{padding:18px;}.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px;}.ff{display:flex;flex-direction:column;gap:4px;}
.ff label{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-family:var(--font-mono);}
.ff input,.ff select,.ff textarea{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--text);font-size:13px;}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--accent);}
.ff textarea{min-height:60px;resize:vertical;}.full{grid-column:1/-1;}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.btn{padding:7px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:700;}
.bp{background:var(--accent);color:#fff;}.bp:hover{background:#2563eb;}.bs{background:var(--s2);color:var(--text);border:1px solid var(--border);}.bs:hover{border-color:var(--accent);}
.lr{display:flex;gap:6px;}.lr input{flex:1;}
.lb{padding:7px 12px;border-radius:5px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}.lb:disabled{opacity:.5;cursor:not-allowed;}
.ls{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px;font-family:var(--font-mono);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:10px 16px;font-size:13px;font-weight:600;z-index:2000;transform:translateY(60px);opacity:0;transition:all .3s;max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}.toast.success{border-color:var(--green);color:var(--green);}.toast.err{border-color:var(--red);color:var(--red);}.toast.info{border-color:var(--accent);color:var(--accent);}
.trin-guide{font-family:var(--font-mono);font-size:11px;color:var(--dim);line-height:1.8;margin-top:12px;}
@media(max-width:768px){.fg{grid-template-columns:1fr;}.full{grid-column:1/1;}.section-add{flex-wrap:wrap;}.topbar{flex-wrap:wrap;gap:8px;}.ticker-scroll{display:none;}.card-grid{grid-template-columns:1fr 1fr;}.card-grid-2{grid-template-columns:1fr;}.nav{gap:2px;padding:6px 10px;}.nav-tab{padding:5px 10px;font-size:11px;}}
.ticker-ext{font-size:10px;font-weight:600;opacity:.6;margin-left:2px;font-family:var(--font-mono);}
.ext-toggle{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-mono);letter-spacing:.5px;}
.ext-toggle:hover{border-color:var(--accent);color:var(--accent);}
.ext-toggle.active{background:rgba(59,130,246,.1);border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div class="setup-screen" id="fh-screen" style="display:none"></div>
<div id="app">

function isBadEquityResolution(name){if(!name)return false;var n=name.toLowerCase();if(/\s[-/]\s/.test(name)&&/(dram|dollar|pound|euro|yen|franc|peso|rupee|sterling|krona|lira|ruble|won|baht|ringgit|forint)/i.test(name))return true;if(/\b(currency|forex|fx pair|exchange rate|spot rate)\b/.test(n))return true;if(/\b[A-Z]{3}\/[A-Z]{3}\b/.test(name))return true;return false;}

var FRED_KEY=localStorage.getItem('fred_key')||'';

var macro=JSON.parse(localStorage.getItem('apex_macro')||'null')||{t10y:{v:0,chg:0,trend:'—',dt:''},t2y:{v:0,chg:0,trend:'—',dt:''},curve:{v:0,chg:0,trend:'—',dt:''},fedFunds:{v:0,chg:0,trend:'HOLD',dt:''},unemp:{v:0,chg:0,trend:'—',dt:''},claims:{v:0,chg:0,trend:'—',dt:''},breakeven:{v:0,chg:0,trend:'—',dt:''},cpi:{v:0,chg:0,trend:'—',dt:''},oil:{v:0,chg:0,trend:'—',dt:''},dxy:{v:0,chg:0,trend:'—',dt:''},updated:''};
// breadthDirty removed — data is read-only from Nexus

// ── EXTENDED HOURS TRACKING ──────────────────────────────────────────────
var POLYGON_KEY=localStorage.getItem('polygon_key')||'';
var extHrsToggle=localStorage.getItem('apex_ext_hrs')==='true';
var extHrsCache=JSON.parse(localStorage.getItem('apex_ext_data')||'{}');
var extHrsInterval=null;

function getMarketSession(){
  var est=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  var day=est.getDay(),h=est.getHours(),m=est.getMinutes(),min=h*60+m;
  if(day===0||day===6)return'closed';
  if(min>=570&&min<960)return'rth';
  if(min>=240&&min<570)return'pre';
  if(min>=961&&min<1200)return'post';
  return'closed';
}

function getETDateStr(){
  var est=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  return est.getFullYear()+'-'+String(est.getMonth()+1).padStart(2,'0')+'-'+String(est.getDate()).padStart(2,'0');
}

function clearStaleExtData(){
  var today=getETDateStr();
  var cleared=false;
  Object.keys(extHrsCache).forEach(function(sym){
    if(extHrsCache[sym].date&&extHrsCache[sym].date<today){
      delete extHrsCache[sym];
      cleared=true;
    }
  });
  if(cleared){saveExtCache();console.log('[APEX] Cleared stale extended hours data');}
}

function saveExtCache(){
  localStorage.setItem('apex_ext_data',JSON.stringify(extHrsCache));
}

async function fetchAllExtendedHours(){
  if(!POLYGON_KEY)return;
  var session=getMarketSession();
  if(session==='rth'||session==='closed')return;
  var tickers=INDEX_SYMS.filter(function(s){return!s.includes('=')&&!s.includes('.')&&s!=='VIX';});
  stocks.forEach(function(s){if(tickers.indexOf(s.ticker)===-1)tickers.push(s.ticker);});
  if(!tickers.length)return;
  var today=getETDateStr();
  for(var i=0;i<tickers.length;i+=5){
    var batch=tickers.slice(i,i+5);
    var fetches=batch.map(function(ticker){
      return fetch('https://api.polygon.io/v2/snapshot/locale/us/markets/stocks/tickers/'+ticker+'?apiKey='+POLYGON_KEY)
        .then(function(r){return r.ok?r.json():null;})
        .catch(function(){return null;});
    });
    try{
      var results=await Promise.all(fetches);
      results.forEach(function(json){
        if(!json||!json.ticker)return;
        var t=json.ticker;
        var sym=t.ticker;
        var lastClose=t.prevDay?t.prevDay.c:0;
        var todayClose=t.day?t.day.c:lastClose;
        if(session==='pre'&&t.preMarket!=null&&lastClose){
          var chg=t.preMarket-lastClose;
          extHrsCache[sym]={session:'pre',price:t.preMarket,changePct:(chg/lastClose)*100,date:today};
        }
        if(session==='post'&&t.afterHours!=null&&todayClose){
          var chg=t.afterHours-todayClose;
          extHrsCache[sym]={session:'post',price:t.afterHours,changePct:(chg/todayClose)*100,date:today};
        }
      });
    }catch(e){console.warn('[APEX] Extended hours batch failed:',e.message);}
    if(i+5<tickers.length)await new Promise(function(r){setTimeout(r,60000);});
  }
  saveExtCache();
  updateTickerScroll();
  if(curPage==='watchlist')renderWatchlist();
  console.log('[APEX] Extended hours data refreshed (',session,')');
}

function startExtHrsRefresh(){
  if(extHrsInterval)clearInterval(extHrsInterval);
  clearStaleExtData();
  var session=getMarketSession();
  if(session==='pre'||session==='post'){
    fetchAllExtendedHours();
    extHrsInterval=setInterval(function(){
      var s=getMarketSession();
      if(s==='pre'||s==='post'){fetchAllExtendedHours();}
      else{clearInterval(extHrsInterval);extHrsInterval=null;}
    },60000);
  }
}

function getExtBadge(sym){
  var ext=extHrsCache[sym];
  if(!ext||ext.date!==getETDateStr())return'';
  var label=ext.session==='pre'?'PM':'AH';

  return'<span class="ticker-ext '+(p>=0?'cell-up':'cell-down')+'">'+label+': '+(p>=0?'+':'')+p.toFixed(2)+'%</span>';
}

function getExtCell(ticker){
  var ext=extHrsCache[ticker];
  if(!ext||ext.date!==getETDateStr())return'<td style="font-family:var(--font-mono);font-size:12px;color:var(--dim)">—</td>';

}

// ── END EXTENDED HOURS ───────────────────────────────────────────────────

// ── ANTS (Advance w/ No Trouble Signs) ───────────────────────────────────
// Two-layer architecture:
//   Layer 1 — Strict flag (O'Neil classic): ≥12/15 up days, ≥20% gain,
//             volRatio ≥0.55 (accumulation dominance), CIR mean on up days ≥0.60
//   Layer 2 — Score 0-100 (weighted): up-days 30, gain 20, volRatio 20, CIR 15, R² 15
// Purpose: filter leaders under sustained institutional accumulation over ~3 weeks.
// Not an entry signal — surfaces candidates; wait for consolidation/pullback to execute.
// Data source: Polygon aggregates (daily, adjusted). Cached per-session in memory.
// Contract is identical to the companion Python module in nexus-backend — if/when
// compute is moved server-side, swap the fetch URL; UI renderer stays unchanged.
var antsCache={};   // ticker -> {ts, flag, score, components, sufficient, stale}
var antsInflight={};// ticker -> Promise (dedupes concurrent fetches)
var ANTS_TTL_MS=6*60*60*1000; // 6h client-side cache; backend has its own

// ANTS compute lives in nexus-backend (/api/ants/batch). The browser never
// sees the Polygon key — backend holds it as a Railway env var.

// Fetch + cache ANTS for one ticker, with in-memory cache + inflight dedupe.
async function antsForTicker(ticker,force){
  var now=Date.now();
  var cached=antsCache[ticker];
  if(!force&&cached&&(now-cached.ts)<ANTS_TTL_MS)return cached;
  if(antsInflight[ticker])return antsInflight[ticker];
  antsInflight[ticker]=(async function(){
    try{
      var url=NEXUS_API+'/api/ants/batch?symbols='+encodeURIComponent(ticker)+(force?'&force=true':'');
      var r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      var data=await r.json();
      var v=(data.ants||{})[ticker]||{};
      var result={ts:now,flag:!!v.flag,score:v.score,components:v.components,sufficient:!!v.sufficient,stale:!!v.stale};
      antsCache[ticker]=result;
      return result;
    }catch(e){
      console.warn('[APEX] ANTS fetch failed for '+ticker+':',e.message);
      return{ts:now,flag:false,score:null,components:null,sufficient:false,stale:true};
    }finally{
      delete antsInflight[ticker];
    }
  })();
  return antsInflight[ticker];
}

var antsSortMode=localStorage.getItem('apex_ants_sort')||'off'; // 'off' | 'desc'
window.toggleAntsSort=function(){antsSortMode=(antsSortMode==='off')?'desc':'off';localStorage.setItem('apex_ants_sort',antsSortMode);renderWatchlist();};

// Batch-fetch for the full watchlist via the backend. Single round-trip; the
// server fans out to Polygon, computes, and caches for 6h.
async function fetchAllANTS(opts){
  opts=opts||{};
  var tickers=[...new Set(stocks.map(function(s){return s.ticker;}))];
  if(!tickers.length)return;
  var now=Date.now();
  var toFetch=opts.force?tickers:tickers.filter(function(t){var c=antsCache[t];return!c||(now-c.ts)>=ANTS_TTL_MS;});
  if(!toFetch.length){if(curPage==='watchlist')renderWatchlist();return;}
  try{
    var url=NEXUS_API+'/api/ants/batch?symbols='+encodeURIComponent(toFetch.join(','))+(opts.force?'&force=true':'');
    var r=await fetch(url,{cache:'no-store'});
    if(!r.ok){
      console.warn('[APEX] ANTS endpoint returned '+r.status);
      toFetch.forEach(function(t){antsCache[t]={ts:now,flag:false,score:null,components:null,sufficient:false,stale:true};});
      if(curPage==='watchlist')renderWatchlist();
      return;
    }
    var data=await r.json();
    var results=data.ants||{};
    Object.keys(results).forEach(function(t){
      var v=results[t]||{};
      antsCache[t]={ts:now,flag:!!v.flag,score:v.score,components:v.components,sufficient:!!v.sufficient,stale:!!v.stale};
    });
    var hitRate=data.cached?' ('+data.cached+' cached server-side)':'';
    console.log('[APEX] ANTS refreshed for '+toFetch.length+' tickers'+hitRate);
  }catch(e){
    console.warn('[APEX] ANTS batch fetch failed:',e.message);
    toFetch.forEach(function(t){antsCache[t]={ts:now,flag:false,score:null,components:null,sufficient:false,stale:true};});
  }
  if(curPage==='watchlist')renderWatchlist();
}

// Cell renderer. Score badge + ant icon when strict flag fires.
// Hover tooltip exposes all 5 components — power-user can inspect drivers.
function antsCell(ticker){
  var a=antsCache[ticker];
  if(!a)return'<span class="cell-ants-pending" title="Loading from nexus-backend…">…</span>';
  if(!a.sufficient||a.score==null){
    var msg=a.stale?'ANTS backend unavailable':'Insufficient history or data unavailable';
    return'<span class="cell-ants-na" title="'+msg+'">—</span>';
  }
  var c=a.components||{};
  var cls=a.score>=70?'ants-s-hi':a.score>=50?'ants-s-md':'ants-s-lo';
  var tip='ANTS — 15-day institutional accumulation filter\n'+
    'Score: '+a.score+'/100'+(a.flag?' · STRICT FLAG ✓':'')+'\n'+
    '• Up days: '+c.upDays+'/15 (need ≥12)\n'+
    '• Gain: '+(c.gainPct>=0?'+':'')+c.gainPct+'% (need ≥20%)\n'+
    '• Vol ratio (up/total): '+c.volRatio+' (need ≥0.55)\n'+
    '• CIR on up days: '+c.cirUp+' (need ≥0.60)\n'+
    '• Trend R²: '+c.r2;
  var flagHtml=a.flag?'<span class="ants-flag">🐜</span>':'';
  return'<span class="cell-ants" title="'+tip.replace(/"/g,'&quot;')+'"><span class="ants-score '+cls+'">'+a.score+'</span>'+flagHtml+'</span>';
}
// ── END ANTS ─────────────────────────────────────────────────────────────

// ── WANDA SCORE (backend composite, batched) ─────────────────────────────
// Contract: GET NEXUS_API/api/wanda?symbols=A,B,C → {wanda:{TICKER:score}}
// score: integer 0-100, or null/missing if unavailable.
var wandaCache={};            // ticker -> {ts, score, stale}
var wandaInflightAll=null;    // single in-flight promise for the batch
var WANDA_TTL_MS=6*60*60*1000; // 6h — same TTL as ANTS for parity
var WANDA_BATCH=50;
function wandaCell(ticker){
  var w=wandaCache[ticker];
  if(!w)return'<span class="cell-wanda-pending">…</span>';
  if(w.score==null)return'<span class="cell-wanda-na" title="Wanda score unavailable">—</span>';
  var cls=w.score>=70?'wanda-s-hi':w.score>=50?'wanda-s-md':'wanda-s-lo';
  var tip='WANDA — backend composite score\nScore: '+w.score+'/100'+(w.stale?' · (cached)':'');
  return'<span class="cell-wanda" title="'+tip.replace(/"/g,'&quot;')+'"><span class="wanda-score '+cls+'">'+w.score+'</span></span>';
}
async function fetchAllWanda(opts){
  if(wandaInflightAll)return wandaInflightAll;
  var now=Date.now();
  var tickers=[...new Set(stocks.map(function(s){return s.ticker;}))];
  if(!(opts&&opts.force)){
    tickers=tickers.filter(function(t){var c=wandaCache[t];return !c||(now-c.ts)>=WANDA_TTL_MS;});
  }
  if(!tickers.length)return;
  wandaInflightAll=(async function(){

// ── 52-WEEK HIGH ─────────────────────────────────────────────────────────
// Source order: (1) /api/prices field, if the backend sends one;
// (2) Polygon daily aggs (needs polygon_key), cached 24h in localStorage.
// Displayed high = max(cached high, live price), so a new high shows at once
// and a stale cache can never show price above the 52W high.
var H52_TTL_MS=24*60*60*1000;
var H52_POLY_GAP_MS=13000;   // Polygon free tier = 5 req/min
var H52_FIELDS=['high52','fiftyTwoWeekHigh','52w_high','week52High','yearHigh','high_52w'];
var h52Cache=(function(){try{return JSON.parse(localStorage.getItem('apex_h52')||'{}')||{};}catch(e){return{};}})();
var h52Running=false;
function h52Save(){try{localStorage.setItem('apex_h52',JSON.stringify(h52Cache));}catch(e){}}
function h52FromBackend(sym,d){
  for(var i=0;i<H52_FIELDS.length;i++){
    var v=parseFloat(d[H52_FIELDS[i]]);
    if(isFinite(v)&&v>0){h52Cache[sym]={high:v,ts:Date.now(),src:'nexus'};h52Save();return;}
  }
}
function h52Fresh(t){var c=h52Cache[t];return !!(c&&c.high>0&&(Date.now()-c.ts)<H52_TTL_MS);}
function h52Value(t){
  var c=h52Cache[t];if(!c||!(c.high>0))return null;
  var px=gp(t);return px>0?Math.max(c.high,px):c.high;
}
function h52Off(t){var hi=h52Value(t),px=gp(t);return(hi&&px>0)?(px/hi-1)*100:null;}
function h52Cell(t){
  var c=h52Cache[t];
  if(!c||!(c.high>0)){
    var why=POLYGON_KEY?'Loading 52W high…':'No 52W data — backend field missing and no Polygon key';
    return'<span class="cell-h52-na" title="'+why+'">'+(POLYGON_KEY?'…':'—')+'</span>';
  }
  var px=gp(t),hi=h52Value(t);
  var off=px>0?(px/hi-1)*100:null;       // 0 at the high, negative below it
  var isNew=px>0&&px>=c.high;
  var cls=off==null?'h52-far':isNew?'h52-at':off>=-5?'h52-near':off>=-15?'h52-mid':off>=-25?'h52-far':'h52-deep';
  var tip='52-WEEK HIGH: $'+hi.toFixed(2)+
    (off!=null?'\nDistance: '+off.toFixed(1)+'%':'')+
    '\nCANSLIM N: within 15% of high = '+(off!=null&&off>=-15?'PASS':'FAIL')+
    '\nSource: '+(c.src==='nexus'?'nexus-backend':'Polygon daily bars')+' · '+new Date(c.ts).toLocaleDateString();
  var line2=isNew?'<span class="h52-new">NEW HI</span>':
    '<span class="h52-off '+cls+'">'+(off==null?'—':off.toFixed(1)+'%')+'</span>';
  return'<span class="cell-h52" title="'+tip.replace(/"/g,'&quot;')+'"><span class="h52-px">$'+hi.toFixed(2)+'</span>'+line2+'</span>';
}
// Update cells in place so the quick-add inputs are not reset mid-typing.
function h52Paint(t){
  document.querySelectorAll('td[data-h52="'+t+'"]').forEach(function(td){td.innerHTML=h52Cell(t);});
}
async function h52FetchPolygon(t){
  var to=new Date(),from=new Date(to.getTime()-366*864e5);
  var f=function(d){return d.toISOString().slice(0,10);};
  var url='https://api.polygon.io/v2/aggs/ticker/'+encodeURIComponent(t)+'/range/1/day/'+f(from)+'/'+f(to)+
    '?adjusted=true&sort=asc&limit=400&apiKey='+POLYGON_KEY;
  var r=await fetch(url);
  if(r.status===429)throw new Error('rate');
  if(!r.ok)return null;
  var j=await r.json(),bars=j.results||[];
  if(!bars.length)return null;
  var hi=0;bars.forEach(function(b){if(b.h>hi)hi=b.h;});
  return hi>0?hi:null;
}
async function fetchAllH52(){
  if(h52Running||!POLYGON_KEY)return;
  var queue=[...new Set(stocks.map(function(s){return s.ticker;}))].filter(function(t){return !h52Fresh(t);});
  if(!queue.length)return;
  h52Running=true;
  try{
    for(var i=0;i<queue.length;i++){
      var t=queue[i];
      if(h52Fresh(t))continue;               // backend may have filled it meanwhile
      try{
        var hi=await h52FetchPolygon(t);
        if(hi){h52Cache[t]={high:hi,ts:Date.now(),src:'polygon'};h52Save();}
      }catch(e){
        if(e.message==='rate'){await new Promise(function(r){setTimeout(r,60000);});i--;continue;}
        console.warn('[APEX] 52W high fetch failed for '+t+':',e.message);
      }
      h52Paint(t);
      if(i<queue.length-1)await new Promise(function(r){setTimeout(r,H52_POLY_GAP_MS);});
    }
  }finally{h52Running=false;}
}

// ---- Multi-group membership ----
// Each stock carries lists:[sectionId,...]. One record per ticker; the same
// stage/RS/setup/notes show in every group. The legacy `list` field is kept
// in sync (lists[0]) so older readers of the JSONBin keep working.
var VALID_LISTS=SECTIONS.map(function(s){return s.id;});
var LIST_MIGRATE={weekly:'focus',daily:'bullsnort',topdawg:'topdog',insider:'insiderbuy',insidersell:'ep',shorts:'doublers'};
function stockLists(s){
  var out=[];
  var src=Array.isArray(s.lists)?s.lists:[];
  if(!src.length&&s.list)src=[s.list];
  src.forEach(function(l){var v=LIST_MIGRATE[l]||l;if(VALID_LISTS.indexOf(v)>=0&&out.indexOf(v)<0)out.push(v);});
  if(!out.length)out.push('focus');
  return out;
}
function syncListField(s){s.lists=stockLists(s);s.list=s.lists[0];return s;}
function normalizeStocks(arr){
  var byTicker={},out=[];
  (arr||[]).forEach(function(s){
    if(!s||!s.ticker)return;
    s.ticker=String(s.ticker).trim().toUpperCase();
    if(!s.addedDate){var ad=addedDateOf(s);if(ad)s.addedDate=ad;}
    syncListField(s);
    var k=byTicker[s.ticker];
    if(!k){byTicker[s.ticker]=s;out.push(s);return;}
    // Merge duplicate ticker: union groups, fill blanks from the duplicate.
    s.lists.forEach(function(l){if(k.lists.indexOf(l)<0)k.lists.push(l);});
    ['company','sector','notes','wf'].forEach(function(f){if(!k[f]&&s[f])k[f]=s[f];});
    if(!k.rs&&s.rs)k.rs=s.rs;if((!Array.isArray(k.rsHistory)||!k.rsHistory.length)&&Array.isArray(s.rsHistory)&&s.rsHistory.length)k.rsHistory=s.rsHistory;if((!Array.isArray(k.stageHistory)||!k.stageHistory.length)&&Array.isArray(s.stageHistory)&&s.stageHistory.length)k.stageHistory=s.stageHistory;
    if(k.addedDate&&s.addedDate&&s.addedDate<k.addedDate)k.addedDate=s.addedDate;
    if(s.notesEdited&&(!k.notesEdited||s.notesEdited>k.notesEdited))k.notesEdited=s.notesEdited;
    k.list=k.lists[0];
  });
  return out;
}

function applyRs(t,newRs){newRs=parseInt(newRs)||0;var today=new Date().toISOString().split('T')[0];var h=(Array.isArray(t.rsHistory)&&t.rsHistory.length)?t.rsHistory:[{d:t.addedDate||today,rs:parseInt(t.rs)||0}];var last=h[h.length-1];if(newRs!==last.rs){if(last.d===today){last.rs=newRs;}else{h.push({d:today,rs:newRs});}}if(h.length>1&&h[h.length-1].rs===h[h.length-2].rs){h.pop();}if(h.length>60)h=h.slice(-60);t.rs=newRs;t.rsHistory=h;return t;}
function rsDeltaBadge(s){var h=s.rsHistory;if(!Array.isArray(h)||h.length<2)return'';var cur=parseInt(s.rs)||0;var prev=h[h.length-2];var d=cur-prev.rs;if(!d)return'';var a=cur-h[0].rs;function sgn(n){return(n>0?'+':'')+n;}var tip='RS '+sgn(d)+' vs '+prev.rs+' on '+prev.d+' \u00b7 since add: '+sgn(a)+' (from '+h[0].rs+' on '+h[0].d+')';return'<span class="rs-delta '+(d>0?'up':'dn')+'" title="'+tip+'">'+sgn(d)+'</span>';}function stageKey(v){var m=/([1-4])\s*([abc])?\s*$/i.exec(String(v||'').trim());return m?{m:+m[1],s:m[2]?m[2].toUpperCase():''}:null;}function stageCode(v){var k=stageKey(v);return k?k.m+k.s:'?';}var STAGE_HEALTH={1:2,2:3,3:1,4:0};function stageMove(from,to){var a=stageKey(from),b=stageKey(to);if(!a||!b)return null;if(a.m!==b.m){var f=(b.m-a.m+4)%4;return{dir:f===3?'dn':'up',tone:STAGE_HEALTH[b.m]>STAGE_HEALTH[a.m]?'up':'dn'};}var sa=a.s?a.s.charCodeAt(0)-64:0,sb=b.s?b.s.charCodeAt(0)-64:0;if(sa===sb)return null;if(!sa||!sb)return{dir:'nt',tone:'nt'};var fwd=sb>sa;return{dir:fwd?'up':'dn',tone:a.m===1?(fwd?'up':'dn'):a.m===3?(fwd?'dn':'up'):'nt'};}function applyStage(t,newSt){newSt=newSt||'Stage 2';var today=new Date().toISOString().split('T')[0];var h=(Array.isArray(t.stageHistory)&&t.stageHistory.length)?t.stageHistory:[{d:t.addedDate||today,st:t.stage||newSt}];var last=h[h.length-1];if(stageCode(newSt)!==stageCode(last.st)){if(last.d===today){last.st=newSt;}else{h.push({d:today,st:newSt});}}if(h.length>1&&stageCode(h[h.length-1].st)===stageCode(h[h.length-2].st)){h.pop();}if(h.length>60)h=h.slice(-60);t.stage=newSt;t.stageHistory=h;return t;}function stageDeltaBadge(s){var h=s.stageHistory;if(!Array.isArray(h)||h.length<2)return'';var prev=h[h.length-2],cur=h[h.length-1];var mv=stageMove(prev.st,s.stage);if(!mv)return'';var arrow=mv.dir==='up'?'\u25b2':mv.dir==='dn'?'\u25bc':'\u2022';var age=Math.max(0,Math.floor((Date.now()-Date.parse(cur.d))/864e5));var mean=mv.tone==='up'?'constructive':mv.tone==='dn'?'deterioration':'sub-stage change';var tip='Stage '+stageCode(prev.st)+' \u2192 Stage '+stageCode(s.stage)+' on '+cur.d+' ('+age+'d ago) \u00b7 '+mean+' \u00b7 first recorded: '+stageCode(h[0].st)+' on '+h[0].d;return'<span class="st-delta '+mv.tone+'" title="'+tip+'">'+arrow+' '+stageCode(prev.st)+'</span>';}

function etDateOf(ms){var e=new Date(new Date(ms).toLocaleString('en-US',{timeZone:'America/New_York'}));return e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');}
function addedDateOf(s){if(s&&typeof s.addedDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s.addedDate))return s.addedDate;var n=Number(s&&s.id);return(n>1e12&&n<=Date.now())?etDateOf(n):'';}
function dayDiff(a,b){return Math.max(0,Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5));}
function fmtMD(d){var p=d.split('-');return p[1]+'/'+p[2]+(p[0]!==getETDateStr().slice(0,4)?'/'+p[0].slice(2):'');}
function fmtETStamp(iso){return new Date(iso).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})+' ET';}
function addedCell(s){var d=addedDateOf(s);if(!d)return'<span class="cell-dt-na" title="Date added not recorded">\u2014</span>';var age=dayDiff(d,getETDateStr());return'<span class="cell-dt" title="Added '+d+' \u00b7 '+age+'d on watchlist"><span>'+fmtMD(d)+'</span><span class="dt-age">'+age+'d</span></span>';}
function editedCell(s){var ms=s.notesEdited?Date.parse(s.notesEdited):NaN;if(isNaN(ms))return'<span class="cell-dt-na" title="No Setup/Notes edit recorded since add (or edit made before tracking existed)">\u2014</span>';var d=etDateOf(ms),age=dayDiff(d,getETDateStr());var cls=age<=7?'fresh':age>30?'stale':'';return'<span class="cell-dt" title="Setup/Notes last edited '+fmtETStamp(s.notesEdited)+'"><span>'+fmtMD(d)+'</span><span class="dt-age '+cls+'">'+(age===0?'today':age+'d ago')+'</span></span>';}
function notesMetaText(s){var d=addedDateOf(s);return'Added '+(d||'\u2014')+' \u00b7 Notes last edited '+(s.notesEdited?fmtETStamp(s.notesEdited):'\u2014');}

// ── FRED API ─────────────────────────────────────────────────────────────
var FRED_BASE='https://api.stlouisfed.org/fred/series/observations';
var FRED_MAP=[
  {series:'DGS10',key:'t10y',label:'10Y',divisor:1},
  {series:'DGS2',key:'t2y',label:'2Y',divisor:1},
  {series:'T10Y2Y',key:'curve',label:'Curve',divisor:1},
  {series:'DFF',key:'fedFunds',label:'FedFunds',divisor:1},
  {series:'UNRATE',key:'unemp',label:'Unemp',divisor:1},
  {series:'ICSA',key:'claims',label:'Claims',divisor:1000},
  {series:'T10YIE',key:'breakeven',label:'BkEven',divisor:1},
  {series:'CPIAUCSL',key:'cpi',label:'CPI',divisor:1},
  {series:'DCOILWTICO',key:'oil',label:'Oil',divisor:1},
  {series:'DTWEXBGS',key:'dxy',label:'DXY',divisor:1}
];
function fredTrend(key,chg,val){
  if(key==='curve')return val>=0?'NORMAL':'INVERTED';
  if(key==='fedFunds')return chg>0?'HIKING':chg<0?'CUTTING':'HOLD';
  if(key==='unemp')return chg>0?'RISING':chg<0?'IMPROVING':'STABLE';
  if(key==='claims')return val>300?'ELEVATED':chg>0?'RISING':'HEALTHY';
  if(key==='breakeven')return val>3?'HOT':val<2?'CONTAINED':'MODERATE';
  if(key==='cpi')return chg>0?'RISING':'COOLING';
  return chg>0?'RISING':chg<0?'FALLING':'FLAT';
}
window.fetchFRED=async function(){
  if(!FRED_KEY){showToast('Add FRED API key in Settings','info');return;}
  showToast('Fetching FRED data...','info');
  var count=0;
  for(var m of FRED_MAP){
    try{
      var url=FRED_BASE+'?series_id='+m.series+'&api_key='+FRED_KEY+'&file_type=json&sort_order=desc&limit=5';
      var r=await fetch(url);if(!r.ok)continue;var d=await r.json();
      var obs=(d.observations||[]).filter(function(o){return o.value!=='.'&&!isNaN(parseFloat(o.value));});
      if(obs.length>=2){
        var latest=parseFloat(obs[0].value)/m.divisor;
        var prev=parseFloat(obs[1].value)/m.divisor;
        var chg=latest-prev;
        var dt=obs[0].date;
        var trend=fredTrend(m.key,chg,latest);
        macro[m.key]={v:Math.round(latest*1000)/1000,chg:Math.round(chg*1000)/1000,trend:trend,dt:dt};
        count++;
      }else if(obs.length===1){
        var v=parseFloat(obs[0].value)/m.divisor;
        macro[m.key]={v:Math.round(v*1000)/1000,chg:0,trend:'—',dt:obs[0].date};
        count++;
      }
    }catch(e){console.error('FRED '+m.series,e);}
  }
  macro.updated=new Date().toLocaleString('en-US',{timeZone:'America/New_York'});
  localStorage.setItem('apex_macro',JSON.stringify(macro));
  renderMacro();
  if(count>0){showToast(count+'/'+FRED_MAP.length+' series updated from FRED','success');/* save-breadth-btn removed */}
  else showToast('No data returned — check your FRED key','err');
};
window.updateFRED=function(){var k=document.getElementById('set-fred').value.trim();if(!k)return;FRED_KEY=k;localStorage.setItem('fred_key',k);showToast('FRED key saved','success');};

async function fetchBreadthFromNexus(){
  try{
    var resp=await fetch(NEXUS_API+'/api/market-breadth');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var d=await resp.json();
    if(d){
      if(d.advancing!=null)breadth.adv=d.advancing;
      if(d.declining!=null)breadth.dec=d.declining;
      if(d.unchanged!=null)breadth.unch=d.unchanged;
      if(d.newHighs!=null)breadth.newHighs=d.newHighs;
      if(d.new_highs!=null)breadth.newHighs=d.new_highs;
      if(d.newLows!=null)breadth.newLows=d.newLows;
      if(d.new_lows!=null)breadth.newLows=d.new_lows;
      if(d.upVol!=null)breadth.upVol=d.upVol;
      if(d.up_volume!=null)breadth.upVol=d.up_volume;
      if(d.downVol!=null)breadth.downVol=d.downVol;
      if(d.down_volume!=null)breadth.downVol=d.down_volume;
      if(d.trin!=null)breadth.trin=d.trin;
      if(d.putCallRatio!=null)breadth.putCall=d.putCallRatio;
      if(d.put_call_ratio!=null)breadth.putCall=d.put_call_ratio;
      if(d.mcclellan!=null)breadth.mccOsc=d.mcclellan;
      if(d.mcclellan_oscillator!=null)breadth.mccOsc=d.mcclellan_oscillator;
      if(d.mcclellanOsc!=null)breadth.mccOsc=d.mcclellanOsc;
      if(d.summation!=null)breadth.summIdx=d.summation;
      if(d.summation_index!=null)breadth.summIdx=d.summation_index;
      if(d.summationIndex!=null)breadth.summIdx=d.summationIndex;
      if(d.ema19!=null)breadth.mccEma19=d.ema19;
      if(d.ema39!=null)breadth.mccEma39=d.ema39;
      if(d.mcclellan19!=null)breadth.mccEma19=d.mcclellan19;
      if(d.mcclellan39!=null)breadth.mccEma39=d.mcclellan39;
      // MA breadth
      if(d.ma_breadth&&Array.isArray(d.ma_breadth)){
        d.ma_breadth.forEach(function(m){
          var lbl=(m.label||m.name||m.ma||'').toLowerCase();
          var pct=m.pct||m.percent||m.value||0;
          if(lbl.includes('200'))breadth.pctAbove200=pct;
          if(lbl.includes('100'))breadth.pctAbove100=pct;
          if(lbl.includes('50'))breadth.pctAbove50=pct;
          if(lbl.includes('20'))breadth.pctAbove20=pct;
        });
      }
      if(d.above_ma&&typeof d.above_ma==='object'){
        Object.entries(d.above_ma).forEach(function(e){
          var lbl=e[0].toLowerCase(),pct=parseFloat(e[1])||0;
          if(lbl.includes('200'))breadth.pctAbove200=pct;
          if(lbl.includes('100'))breadth.pctAbove100=pct;
          if(lbl.includes('50'))breadth.pctAbove50=pct;
          if(lbl.includes('20'))breadth.pctAbove20=pct;
        });
      }
      if(d.pctAbove200!=null)breadth.pctAbove200=d.pctAbove200;
      if(d.pctAbove50!=null)breadth.pctAbove50=d.pctAbove50;
      // Sector breadth — normalize ALL incoming names to short display names
      var _snm={'Communication Services':'Comm Services','Consumer Discretionary':'Consumer Disc','Consumer Staples':'Staples','Information Technology':'Info Tech','Health Care':'Healthcare','Real Estate':'Real Estate','Financials':'Financials','Industrials':'Industrials','Materials':'Materials','Utilities':'Utilities','Energy':'Energy'};
      function normSec(n){return _snm[n]||n;}
      if(d.sector_breadth&&Array.isArray(d.sector_breadth)&&d.sector_breadth.length>0){
        breadth.sectors={};
        d.sector_breadth.forEach(function(s){
          var raw=s.name||s.sector||'';
          var name=normSec(raw);
          if(name)breadth.sectors[name]=s.pct||s.percent||s.value||0;
        });
      } else if(d.sectors&&typeof d.sectors==='object'&&!Array.isArray(d.sectors)){
        breadth.sectors={};
        Object.entries(d.sectors).forEach(function(e){breadth.sectors[normSec(e[0])]=parseFloat(e[1])||0;});
      }
      breadth.updated=new Date().toLocaleString('en-US',{timeZone:'America/New_York'});
      localStorage.setItem('apex_breadth',JSON.stringify(breadth));
      if(curPage==='breadth')renderBreadth();
      if(curPage==='dashboard')renderDashboard();
      console.log('[APEX] Breadth data loaded from Nexus');
    }
  }catch(e){console.warn('[APEX] Nexus breadth fetch failed:',e.message);}
}

window.fetchCOT=async function(){
  showToast('Fetching COT data...','info');
  try{
    var resp=await fetch(NEXUS_API+'/api/cot');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var rows=await resp.json();
    if(!rows||!rows.length){showToast('No COT data returned','err');return;}
    var count=0;
    COT_CONTRACTS.forEach(function(contract){
      var all=rows.filter(function(r){return r.market_and_exchange_names===contract.name;})
        .sort(function(a,b){return(b.report_date_as_yyyy_mm_dd||'').localeCompare(a.report_date_as_yyyy_mm_dd||'');});
      if(!all.length)return;
      var cur=all[0],prev=all[1]||null;
      var ncLong=parseInt(cur.noncommercial_positions_long_all||cur.noncomm_positions_long_all||0);
      var ncShort=parseInt(cur.noncommercial_positions_short_all||cur.noncomm_positions_short_all||0);
      var ncNet=ncLong-ncShort;
      var prevNet=prev?(parseInt(prev.noncommercial_positions_long_all||prev.noncomm_positions_long_all||0)-parseInt(prev.noncommercial_positions_short_all||prev.noncomm_positions_short_all||0)):null;
      var wkChg=prevNet!==null?(ncNet-prevNet):0;
      var oi=parseInt(cur.open_interest_all||1);
      var pctOI=((ncNet/oi)*100).toFixed(1);
      var date=(cur.report_date_as_yyyy_mm_dd||'').split('T')[0];
      cotData[contract.label]={
        label:contract.label,cat:contract.cat,date:date,
        ncNet:ncNet,ncChg:wkChg,oi:oi,pctOI:parseFloat(pctOI),
        signal:ncNet>0?'NET LONG':'NET SHORT'
      };
      count++;
    });
    cotData._updated=new Date().toLocaleString('en-US',{timeZone:'America/New_York'});
    localStorage.setItem('apex_cot',JSON.stringify(cotData));
    renderOptCot();
    if(count>0){showToast(count+' COT contracts loaded','success');try{await saveToBin();}catch(e){}}
    else showToast('No matching contracts found','err');
  }catch(e){console.warn('[APEX] COT fetch failed:',e.message);showToast('COT fetch failed','err');}
};

window.quickAdd=async function(secId){var ticker=(document.getElementById('qa-tk-'+secId)||{}).value;if(!ticker||!ticker.trim()){showToast('Enter a ticker','err');return;}ticker=ticker.trim().toUpperCase();var existing=findStockByTicker(ticker);if(existing){var secT=sectionById(secId).title;if(existing.lists.indexOf(secId)>=0){showToast(ticker+' is already in '+secT,'err');return;}existing.lists.push(secId);syncListField(existing);renderWatchlist();var inp0=document.getElementById('qa-tk-'+secId);if(inp0)inp0.value='';try{await saveToBin();showToast(ticker+' added to '+secT+' (shared record)','success');}catch(e){showToast('⚠ Saved LOCAL only — cloud sync FAILED ('+(e.message||'check quota/key')+')','err');}return;}var stock={id:Date.now(),ticker:ticker,company:'',sector:'',list:secId,lists:[secId],stage:(document.getElementById('qa-st-'+secId)||{}).value||'Stage 2',rs:parseInt((document.getElementById('qa-rs-'+secId)||{}).value)||0,ema:'yes',a50:'yes',alertA:0,alertB:0,notes:'',wf:(document.getElementById('qa-wf-'+secId)||{}).value||'',rsh:'no',addedDate:getETDateStr()};applyRs(stock,stock.rs);applyStage(stock,stock.stage);try{var r=await fetch(NEXUS_API+'/api/prices/search?q='+encodeURIComponent(ticker));var d=await r.json();if(d&&d.name&&!isBadEquityResolution(d.name)){stock.company=d.name;if(d.sector)stock.sector=d.sector;}else if(d&&d.name){stock.company='⚠ unresolved ('+ticker+')';}}catch(e){}stocks.unshift(stock);renderWatchlist();var inp=document.getElementById('qa-tk-'+secId);if(inp)inp.value='';var rsInp=document.getElementById('qa-rs-'+secId);if(rsInp)rsInp.value='';antsForTicker(ticker).then(function(){if(curPage==='watchlist')renderWatchlist();});fetchAllWanda();try{await saveToBin();showToast(ticker+' added','success');}catch(e){showToast('⚠ Saved LOCAL only — cloud sync FAILED ('+(e.message||'check quota/key')+')','err');}};

window.openEdit=function(id){editId=id;var s=stocks.find(function(x){return String(x.id)===String(id);});if(!s)return;document.getElementById('mo-title').textContent='Edit '+s.ticker;document.getElementById('f-tk').value=s.ticker;document.getElementById('f-co').value=s.company||'';document.getElementById('f-se').value=s.sector||'';renderGroupChecks(stockLists(s));document.getElementById('f-st').value=s.stage||'Stage 2';var sh=Array.isArray(s.stageHistory)?s.stageHistory:[];document.getElementById('f-sth-reset').checked=false;if(sh.length>1){document.getElementById('f-sth-info').textContent='Reset stage history ('+sh.slice(-4).map(function(e){return stageCode(e.st)+' '+String(e.d).slice(5,10);}).join(' \u2192 ')+')';document.getElementById('f-sth-row').style.display='';}else{document.getElementById('f-sth-row').style.display='none';}document.getElementById('f-rs').value=s.rs||'';document.getElementById('f-em').value=s.ema||'yes';document.getElementById('f-50').value=s.a50||'yes';document.getElementById('f-aa').value=s.alertA||'';document.getElementById('f-ab').value=s.alertB||'';document.getElementById('f-nt').value=s.notes||'';document.getElementById('f-nt-meta').textContent=notesMetaText(s);var wfSel=document.getElementById('f-wf');Array.prototype.slice.call(wfSel.querySelectorAll('option[data-legacy]')).forEach(function(o){o.remove();});if(s.wf&&SETUPS.indexOf(s.wf)<0){var lo=document.createElement('option');lo.textContent=s.wf;lo.setAttribute('data-legacy','1');wfSel.appendChild(lo);}wfSel.value=s.wf||'';document.getElementById('f-rsh').value=s.rsh||'no';setLU('','');document.getElementById('stock-mo').classList.add('open');};
function renderGroupChecks(checked){var el=document.getElementById('f-li');if(!el)return;el.innerHTML=SECTIONS.map(function(sec){var on=checked.indexOf(sec.id)>=0;return'<label><input type="checkbox" value="'+sec.id+'"'+(on?' checked':'')+'><span class="grp-dot" style="background:'+sec.dot+'"></span>'+sec.title+'</label>';}).join('');}
function readGroupChecks(){var el=document.getElementById('f-li');var out=[];if(el)el.querySelectorAll('input[type=checkbox]:checked').forEach(function(c){out.push(c.value);});return out.length?out:['focus'];}
window.closeSMo=function(){document.getElementById('stock-mo').classList.remove('open');editId=null;};
window.saveStk=async function(){var ticker=document.getElementById('f-tk').value.trim().toUpperCase();if(!ticker){showToast('Enter a ticker','err');return;}var wasEdit=!!editId;var oldRec=editId?(stocks.find(function(s){return String(s.id)===String(editId);})||null):null;var stock={id:editId||Date.now(),ticker:ticker,company:document.getElementById('f-co').value.trim(),sector:document.getElementById('f-se').value,list:'focus',lists:readGroupChecks(),stage:oldRec?(oldRec.stage||'Stage 2'):document.getElementById('f-st').value,stageHistory:oldRec?oldRec.stageHistory:undefined,rs:oldRec?(parseInt(oldRec.rs)||0):(parseInt(document.getElementById('f-rs').value)||0),rsHistory:oldRec?oldRec.rsHistory:undefined,ema:document.getElementById('f-em').value,a50:document.getElementById('f-50').value,alertA:parseFloat(document.getElementById('f-aa').value)||0,alertB:parseFloat(document.getElementById('f-ab').value)||0,notes:document.getElementById('f-nt').value.trim(),wf:document.getElementById('f-wf').value,rsh:document.getElementById('f-rsh').value,addedDate:oldRec?addedDateOf(oldRec):getETDateStr(),notesEdited:oldRec?oldRec.notesEdited:undefined};applyRs(stock,parseInt(document.getElementById('f-rs').value)||0);applyStage(stock,document.getElementById('f-st').value);if(oldRec&&((oldRec.notes||'')!==stock.notes||(oldRec.wf||'')!==stock.wf))stock.notesEdited=new Date().toISOString();if(oldRec&&document.getElementById('f-sth-reset').checked){stock.stageHistory=[{d:new Date().toISOString().split('T')[0],st:stock.stage}];}syncListField(stock);var dup=findStockByTicker(ticker);if(dup&&String(dup.id)!==String(stock.id)){stock.lists.forEach(function(l){if(dup.lists.indexOf(l)<0)dup.lists.push(l);});var dupTxt=(dup.notes||'')+'\u0001'+(dup.wf||'');['company','sector','notes','wf'].forEach(function(f){if(stock[f])dup[f]=stock[f];});if((dup.notes||'')+'\u0001'+(dup.wf||'')!==dupTxt)dup.notesEdited=new Date().toISOString();applyStage(dup,stock.stage);applyRs(dup,stock.rs);dup.ema=stock.ema;dup.a50=stock.a50;dup.alertA=stock.alertA;dup.alertB=stock.alertB;dup.rsh=stock.rsh;syncListField(dup);if(editId)stocks=stocks.filter(function(s){return String(s.id)!==String(editId);});showToast(ticker+' merged into existing record','success');}else if(editId){var i=stocks.findIndex(function(s){return String(s.id)===String(editId);});if(i>=0)stocks[i]=stock;}else stocks.unshift(stock);window.closeSMo();renderWatchlist();try{await saveToBin();showToast(wasEdit?ticker+' updated':ticker+' added','success');}catch(e){showToast('⚠ Saved LOCAL only — cloud sync FAILED ('+(e.message||'check quota/key')+')','err');}};
window.delStk=async function(id,secId){
  var s=stocks.find(function(x){return String(x.id)===String(id);});
  if(!s)return;
  var idx=stocks.indexOf(s);
  var before=stockLists(s).slice();
  var removedAll=false,label='';
  if(secId&&before.length>1){
    // Remove from this group only; the record stays in its other groups.
    s.lists=before.filter(function(l){return l!==secId;});syncListField(s);
    label=s.ticker+' removed from '+sectionById(secId).title;
  }else{
    // Last group (or no group given): remove the whole record. No confirm dialog.
    removedAll=true;
    stocks=stocks.filter(function(x){return String(x.id)!==String(id);});
    label=s.ticker+' removed';
  }
  renderWatchlist();
  // Show undo toast
  if(_undoTimer)clearTimeout(_undoTimer);
  _undoStock={stock:s,index:idx,lists:before,removedAll:removedAll};
  showToast(label+' · <span onclick="undoDelete()" style="text-decoration:underline;cursor:pointer;color:var(--accent)">UNDO</span>','err');
  _undoTimer=setTimeout(async function(){
    _undoStock=null;
    try{await saveToBin();}catch(e){console.warn('Delete sync failed');}
  },5000);
};
window.undoDelete=function(){
  if(!_undoStock)return;
  clearTimeout(_undoTimer);
  var s=_undoStock.stock,idx=_undoStock.index;
  s.lists=_undoStock.lists.slice();syncListField(s);
  if(_undoStock.removedAll)stocks.splice(Math.min(idx,stocks.length),0,s);
  _undoStock=null;
  renderWatchlist();
  showToast(s.ticker+' restored','success');
};
window.lookupTk=async function(){var t=document.getElementById('f-tk').value.trim().toUpperCase();if(!t){setLU('Enter ticker','err');return;}var btn=document.getElementById('lu-btn');btn.disabled=true;btn.textContent='...';try{var r=await fetch(NEXUS_API+'/api/prices/search?q='+encodeURIComponent(t));var d=await r.json();if(d&&d.name&&isBadEquityResolution(d.name)){setLU('⚠ resolved to FX/non-equity — check ticker','err');}else if(d&&d.name){document.getElementById('f-co').value=d.name;if(d.sector){document.getElementById('f-se').value=d.sector;}setLU('✓ '+d.name,'ok');}else setLU('Not found','err');}catch(e){setLU('Failed','err');}btn.disabled=false;btn.textContent='Lookup';};
